<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSPΛCE — Real Estate ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------
   BRAND — applied from DSPACE_BRAND_KIT.pdf:
   - Wordmark: "DSPACE", the A rendered as an unbroken peak (no crossbar).
     Reproduced below with the Greek capital Lambda (Λ) glyph, which is
     the same peak shape — no custom SVG/font-editing required.
   - Typeface: "Mundial" (TipoType foundry) — a licensed font this file
     can't embed. Plus Jakarta Sans (Google Fonts) is used as a close
     geometric/humanist stand-in; swap the @font-face / Google Fonts
     link below once the dev has the licensed Mundial font files.
   - Colour: brand system is strict black (#000000) / white (#FFFFFF).
     Chrome (sidebar, buttons, headers, KPI numbers) follows that here.
     Status badges (Available/Sold/New Lead/etc.) keep semantic color
     (green/amber/red/blue) — a deliberate exception, not a brand miss:
     an ERP with 50+ units and dozens of leads needs scannable status
     at a glance. Flag it if you'd rather those go monochrome too.
   - Tagline: "Building Spaces. Creating Futures."
   --------------------------------------------------------------------- */
:root{
  --ink:#000000;
  --ink-2:#161616;
  --ink-3:#262626;
  --gold:#000000;
  --gold-2:#262626;
  --bg:#F4F4F4;
  --card:#FFFFFF;
  --text:#111111;
  --muted:#6B6B6B;
  --muted-2:#9C9C9C;
  --border:#E3E3E3;
  --green:#0E9F6E;
  --green-bg:#E7F8F2;
  --amber:#D97706;
  --amber-bg:#FEF3E2;
  --red:#DC2626;
  --red-bg:#FDEAEA;
  --blue:#2A5CDB;
  --blue-bg:#EAF0FE;
  --slate-bg:#EFEFEF;
  --radius:10px;
  --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: 'Mundial', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}

.sidebar{
  width:236px;
  background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  color:#fff;
  position:fixed; top:0; left:0; bottom:0;
  display:flex; flex-direction:column;
  z-index:40;
  transition:transform .2s ease;
}
.sidebar-brand{
  display:flex; align-items:center; gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand .mark{
  width:34px;height:34px;border-radius:8px;
  background:#FFFFFF;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.sidebar-brand .mark svg{width:16px;height:16px;}
.sidebar-brand .word{font-weight:700; font-size:17px; letter-spacing:1.5px;}
.sidebar-brand .sub{font-size:9.5px; color:rgba(255,255,255,0.5); margin-top:3px; letter-spacing:0.3px; line-height:1.35;}

.nav{flex:1; padding:14px 10px; overflow-y:auto;}
.nav-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px;
  color:rgba(255,255,255,0.35); padding:14px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:8px;
  color:rgba(255,255,255,0.75);
  font-size:13.5px; font-weight:500;
  margin-bottom:2px;
  cursor:pointer;
  border:1px solid transparent;
}
.nav-item svg{width:17px; height:17px; flex:none; opacity:0.85;}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active{
  background:rgba(255,255,255,0.12);
  color:#fff;
  border-color:rgba(255,255,255,0.22);
}
.nav-item.active svg{opacity:1;}
.nav-item .count{
  margin-left:auto; font-size:11px; font-weight:700;
  background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.85);
  padding:1px 7px; border-radius:20px;
}

.sidebar-footer{
  padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:10px;
}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:#FFFFFF; color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-weight:700; font-size:13px; flex:none;
}
.sidebar-footer .who{line-height:1.25;}
.sidebar-footer .who .name{font-size:13px; font-weight:600;}
.sidebar-footer .who .role{font-size:11px; color:rgba(255,255,255,0.5);}

.main{margin-left:236px; flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:30;
  background:#fff; border-bottom:1px solid var(--border);
  padding:14px 28px; display:flex; align-items:center; gap:16px;
}
.topbar h1{font-size:19px; margin:0; font-weight:700;}
.topbar .crumb{font-size:12.5px; color:var(--muted); margin-top:2px;}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--slate-bg); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px; width:230px; color:var(--muted-2);
  font-size:13px;
}
.search-box input{border:none; background:transparent; outline:none; width:100%; color:var(--text);}
.icon-btn{
  width:34px;height:34px;border-radius:8px; border:1px solid var(--border);
  background:#fff; display:flex; align-items:center; justify-content:center; color:var(--muted);
}
.icon-btn:hover{background:var(--slate-bg);}
.menu-toggle{display:none;}

.content{padding:24px 28px 60px; max-width:1360px; width:100%;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:9px 14px; border-radius:8px; border:1px solid transparent;
  font-size:13.5px; font-weight:600; white-space:nowrap;
}
.btn-gold{background:#fff; color:var(--ink); border-color:var(--ink);}
.btn-gold:hover{background:var(--slate-bg);}
.btn-navy{background:var(--ink); color:#fff;}
.btn-navy:hover{background:var(--ink-3);}
.btn-outline{background:#fff; border-color:var(--border); color:var(--text);}
.btn-outline:hover{background:var(--slate-bg);}
.btn-ghost{background:transparent; color:var(--muted); border:none; padding:6px 8px;}
.btn-ghost:hover{color:var(--text); background:var(--slate-bg); border-radius:6px;}
.btn-danger-ghost{background:transparent; color:var(--red); border:none; padding:6px 8px;}
.btn-danger-ghost:hover{background:var(--red-bg); border-radius:6px;}
.btn-sm{padding:6px 10px; font-size:12.5px;}
.btn:disabled{opacity:0.5; cursor:not-allowed;}

/* ---------- cards / kpis ---------- */
.section-title{font-size:15px; font-weight:700; margin:26px 0 12px; display:flex; align-items:center; justify-content:space-between;}
.section-title .hint{font-size:12px; font-weight:500; color:var(--muted-2);}

.command-bar{
  background:linear-gradient(120deg, var(--ink) 0%, var(--ink-3) 100%);
  border-radius:14px; padding:20px 26px; color:#fff; margin-bottom:6px;
  display:flex; flex-wrap:wrap; gap:0; align-items:center;
  box-shadow:var(--shadow);
}
.command-bar .cb-title{
  width:100%; font-size:11px; letter-spacing:1.6px; font-weight:700;
  color:rgba(255,255,255,0.6); margin-bottom:14px;
}
.cb-item{padding:0 22px; border-right:1px solid rgba(255,255,255,0.14);}
.cb-item:first-of-type{padding-left:0;}
.cb-item:last-of-type{border-right:none;}
.cb-item .cb-label{font-size:10.5px; letter-spacing:0.8px; color:rgba(255,255,255,0.55); font-weight:700;}
.cb-item .cb-value{font-size:20px; font-weight:800; margin-top:3px;}

.kpi-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;}
.kpi-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow);
}
.kpi-card .kpi-label{font-size:12px; color:var(--muted); font-weight:600;}
.kpi-card .kpi-value{font-size:24px; font-weight:800; margin-top:6px; letter-spacing:-0.3px;}
.kpi-card .kpi-sub{font-size:11.5px; color:var(--muted-2); margin-top:4px;}
.kpi-card.accent-green .kpi-value{color:var(--green);}
.kpi-card.accent-amber .kpi-value{color:var(--amber);}
.kpi-card.accent-red .kpi-value{color:var(--red);}
.kpi-card.accent-blue .kpi-value{color:var(--blue);}
/* "gold" accent = featured stat. No accent hue in the brand kit, so this
   inverts to a solid black card instead — the same black/white flip the
   brand kit itself uses across its mockups. */
.kpi-card.accent-gold{background:var(--ink); border-color:var(--ink);}
.kpi-card.accent-gold .kpi-label{color:rgba(255,255,255,0.6);}
.kpi-card.accent-gold .kpi-value{color:#fff;}
.kpi-card.accent-gold .kpi-sub{color:rgba(255,255,255,0.5);}

.quick-actions{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px;}

/* ---------- panel / table ---------- */
.panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
.panel-head{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.panel-head h2{font-size:15.5px; margin:0; font-weight:700;}
.panel-head .spacer{flex:1;}
.filter-row{display:flex; gap:8px; flex-wrap:wrap;}
.filter-row select, .filter-row input{
  padding:7px 10px; border:1px solid var(--border); border-radius:7px; background:#fff; color:var(--text); font-size:12.5px;
}
table{width:100%; border-collapse:collapse;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
  color:var(--muted); font-weight:700; padding:10px 16px; background:var(--slate-bg);
  border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.table-wrap{overflow-x:auto;}
.cell-strong{font-weight:700;}
.cell-muted{color:var(--muted);}
.row-actions{display:flex; gap:2px;}

.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;
}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.badge-green{background:var(--green-bg); color:var(--green);}
.badge-green .badge-dot{background:var(--green);}
.badge-amber{background:var(--amber-bg); color:var(--amber);}
.badge-amber .badge-dot{background:var(--amber);}
.badge-red{background:var(--red-bg); color:var(--red);}
.badge-red .badge-dot{background:var(--red);}
.badge-blue{background:var(--blue-bg); color:var(--blue);}
.badge-blue .badge-dot{background:var(--blue);}
.badge-slate{background:var(--slate-bg); color:var(--muted);}
.badge-slate .badge-dot{background:var(--muted-2);}
.badge-gold{background:var(--ink); color:#fff;}
.badge-gold .badge-dot{background:#fff;}

.empty-state{padding:60px 20px; text-align:center; color:var(--muted-2);}
.empty-state .es-icon{font-size:34px; margin-bottom:8px;}
.empty-state .es-title{font-weight:700; color:var(--text); font-size:14px; margin-bottom:4px;}

.pill-tabs{display:flex; gap:6px; padding:4px; background:var(--slate-bg); border-radius:9px; width:fit-content;}
.pill-tab{padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--muted);}
.pill-tab.active{background:#fff; color:var(--ink); box-shadow:var(--shadow);}

/* ---------- modal / forms ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,20,30,0.5); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  background:#fff; border-radius:14px; width:100%; max-width:720px;
  box-shadow:0 20px 60px rgba(10,15,30,0.35);
  animation:pop .15s ease;
}
.modal.modal-wide{max-width:920px;}
.modal.modal-sm{max-width:480px;}
@keyframes pop{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.modal-head{
  display:flex; align-items:center; gap:12px; padding:18px 22px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff; border-radius:14px 14px 0 0;
}
.modal-head h3{margin:0; font-size:16px; font-weight:700;}
.modal-head .sub{font-size:12px; color:var(--muted); margin-top:2px;}
.modal-close{margin-left:auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px;}
.modal-close:hover{background:var(--slate-bg);}
.modal-body{padding:20px 22px; max-height:66vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

.form-section{margin-bottom:22px;}
.form-section:last-child{margin-bottom:0;}
.form-section-title{
  font-size:11.5px; text-transform:uppercase; letter-spacing:0.7px; font-weight:800;
  color:#fff; background:var(--ink); display:inline-block; padding:3px 10px; border-radius:5px; margin-bottom:12px;
}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex; flex-direction:column; gap:6px;}
.field.full{grid-column:1 / -1;}
.field label{font-size:12.5px; font-weight:600; color:var(--text);}
.field label .opt{font-weight:400; color:var(--muted-2); font-size:11px;}
.field input, .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--border); border-radius:8px; outline:none; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--ink-3);}
.field textarea{resize:vertical; min-height:64px;}
.checkbox-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px 10px;}
.chk{display:flex; align-items:center; gap:7px; font-size:12.5px; padding:6px 8px; border:1px solid var(--border); border-radius:7px;}
.chk input{margin:0;}
.file-btn{
  border:1.5px dashed var(--border); border-radius:8px; padding:14px; text-align:center; color:var(--muted); font-size:12.5px; background:var(--slate-bg);
}
.helper-text{font-size:11.5px; color:var(--muted-2); margin-top:6px;}
.toast{
  position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:9px;
  font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,0.25); z-index:200; display:flex; align-items:center; gap:8px;
  transform:translateY(20px); opacity:0; pointer-events:none; transition:all .2s ease;
}
.toast.show{transform:translateY(0); opacity:1;}

.progress-track{height:6px; background:var(--slate-bg); border-radius:6px; overflow:hidden; width:90px;}
.progress-fill{height:100%; background:var(--green);}

.two-col{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
.mini-panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
.mini-panel h3{font-size:13.5px; margin:0 0 12px;}
.rank-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.rank-row:last-child{border-bottom:none;}
.rank-badge{width:22px;height:22px;border-radius:50%; background:var(--slate-bg); color:var(--muted); font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; flex:none;}
.rank-badge.gold{background:var(--gold); color:#fff;}
.rank-name{font-weight:600; flex:1;}
.rank-val{font-weight:700; color:var(--ink);}

.dev-note{
  background:#FFF8E8; border:1px solid #F0DFAE; color:#8A6A0F; font-size:12px; border-radius:8px; padding:10px 14px; margin-bottom:18px;
}

@media (max-width: 980px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .form-grid, .form-grid.cols-3{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .search-box{display:none;}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="square"><path d="M4 19L12 4L20 19"/></svg></div>
      <div>
        <div class="word">DSPΛCE</div>
        <div class="sub">Building Spaces. Creating Futures.</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="avatar">TA</div>
      <div class="who">
        <div class="name">Thanseem</div>
        <div class="role">Founder / Admin</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="crumb" id="page-crumb">DSPACE Overview</div>
      </div>
      <div class="topbar-right">
        <div class="search-box">🔍 <input placeholder="Search projects, leads, units…" id="global-search"></div>
        <button class="icon-btn" title="Notifications">🔔</button>
      </div>
    </div>
    <div class="content" id="view-root"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   DSPACE ERP — front-end UI reference build.
   Single-file HTML/CSS/JS. Data is held in-memory + persisted to
   localStorage purely so this mockup is clickable/demoable.
   NOTE FOR DEV HANDOFF: swap the DATA LAYER (seed/load/save + the CRUD
   functions marked "// API:" ) for real API calls + a shared database —
   everything above the data layer (render/UI) can stay as-is.
   ========================================================================= */

/* ---------------------------- utilities -------------------------------- */
const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(n, base){ const d = base ? new Date(base) : new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isToday(d){ return d === todayISO(); }
function isThisMonth(d){ if(!d) return false; const a=new Date(d), b=new Date(); return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }
function formatDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function formatNum(n){ return Number(n||0).toLocaleString('en-IN'); }
function formatINR(n){ n = Number(n||0); return '₹' + n.toLocaleString('en-IN'); }
function formatCr(n){
  n = Number(n||0);
  if (n >= 10000000) return '₹' + (n/10000000).toFixed(2).replace(/\.00$/,'') + ' Cr';
  if (n >= 100000) return '₹' + (n/100000).toFixed(2).replace(/\.00$/,'') + ' L';
  return formatINR(n);
}
function uid(prefix, n){ return prefix + '-' + String(n).padStart(3,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function openModal(html, wide, sm){
  document.getElementById('modal').className = 'modal' + (wide?' modal-wide':'') + (sm?' modal-sm':'');
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.getElementById('modal').innerHTML=''; }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

function badge(text, kind){
  return `<span class="badge badge-${kind}"><span class="badge-dot"></span>${esc(text)}</span>`;
}
const STATUS_KIND = {
  // project status
  'Upcoming':'blue','Under Construction':'amber','Ready to Move':'green','Completed':'green','On Hold':'red','Sold Out':'gold',
  // unit status
  'Available':'green','Reserved':'amber','Sold':'blue','Hold':'red',
  // lead status
  'New':'blue','Contacted':'amber','Site Visit Scheduled':'gold','Negotiation':'amber','Converted':'green','Lost':'red',
  // visit status
  'Scheduled':'blue','Completed Visit':'green','Cancelled':'red','No-show':'red',
  // booking / commission
  'Booked':'blue','Confirmed':'green','Received':'green','Pending':'amber',
  // realtor
  'Active':'green','Inactive':'slate',
  // rera

function mkProject(n,name,dev,type,status,city,locality,district,state,launchOffset,expOffset,possOffset,teamCount,realtorIdxs,unitTypes,priceRange,psf,amenities){
  const rid = uid('DSP', n);
  return {
    id: rid, name, developer: dev, type, status,
    location: city, locality, district, state,
    mapsUrl: 'https://maps.google.com/?q=' + encodeURIComponent(name+' '+city),
    website: 'https://' + name.toLowerCase().replace(/[^a-z0-9]+/g,'') + '.com',
    dspaceUrl: 'https://dspace.co.in/projects/' + rid.toLowerCase(),
    rera: 'K-RERA/PRJ/' + (2024 + (n%3)) + '/' + (1000+n*37),
    reraStatus: status==='Upcoming' ? 'Applied / Pending' : 'Registered',
    launchDate: addDays(launchOffset), expectedCompletion: addDays(expOffset), possessionDate: addDays(possOffset),
    unitTypes, priceRange, pricePerSqft: psf,
    amenities,
    assignedRealtors: realtorIdxs.map(i=>uid('RLT', Math.min(i,6))),
    notes: ''
  };
}
function mkRealtor(n,name,phone,email,agency,region,rate,status){
  return { id: uid('RLT', n), name, phone, email, agency, region, commissionRate: rate, status };
}
function mkLead(n,name,phone,email,source,projectN,budget,status,realtorN,followOffset,createdOffsetPast){
  return {
    id: uid('LD', n), name, phone, email, source,
    projectId: projectN ? uid('DSP', projectN) : '',
    budget, status,
    realtorId: realtorN ? uid('RLT', realtorN) : '',
    followUpDate: followOffset!==undefined && followOffset!==null ? addDays(followOffset) : '',
    createdDate: addDays(-createdOffsetPast),
    notes: ''
  };
}
function mkVisit(n,leadN,projectN,unitId,realtorN,dateOffset,status){
  return {
    id: uid('SV', n), leadId: uid('LD', leadN), projectId: uid('DSP', projectN), unitId: unitId || '',
    realtorId: uid('RLT', realtorN), date: addDays(dateOffset), time: ['10:00 AM','11:30 AM','2:00 PM','4:00 PM','5:30 PM'][n%5],
    status, feedback: status==='Completed Visit' ? 'Interested, comparing with another project.' : ''
  };
}
function mkBooking(n,leadN,realtorNUnused,unitId,realtorN,dateOffset,saleValue,commission,rate,commStatus,status){

    saleValue, tokenAmount: Math.round(saleValue*0.1), commissionRate: rate, commissionAmount: commission,
    commissionStatus: commStatus, status

}

function dashboardMetrics(){
  const p = DB.projects, u = DB.units, l = DB.leads, r = DB.realtors, v = DB.visits, b = DB.bookings;
  const bookingsThisMonth = b.filter(x=>isThisMonth(x.bookingDate));
  const salesValueThisMonth = bookingsThisMonth.reduce((s,x)=>s+Number(x.saleValue||0),0);
  const expectedCommission = b.reduce((s,x)=>s+Number(x.commissionAmount||0),0);
  const commissionReceived = b.filter(x=>x.commissionStatus==='Received').reduce((s,x)=>s+Number(x.commissionAmount||0),0);

  const realtorSales = {};
  b.forEach(x=>{ realtorSales[x.realtorId] = (realtorSales[x.realtorId]||0) + Number(x.saleValue||0); });
  let topRealtor = null, topVal = -1;
  Object.entries(realtorSales).forEach(([rid,val])=>{ if(val>topVal){ topVal=val; topRealtor=rid; } });

  return {
    totalProjects: p.length,
    activeProjects: p.filter(x=>x.status==='Under Construction').length,
    upcomingProjects: p.filter(x=>x.status==='Upcoming').length,
    totalUnits: u.length,
    availableUnits: u.filter(x=>x.status==='Available').length,
    reservedUnits: u.filter(x=>x.status==='Reserved').length,
    soldUnits: u.filter(x=>x.status==='Sold').length,
    onHoldUnits: u.filter(x=>x.status==='On Hold' || x.status==='Hold').length,
    totalLeads: l.length,
    newLeadsToday: l.filter(x=>isToday(x.createdDate)).length,
    followUpsDueToday: l.filter(x=>isToday(x.followUpDate)).length,
    siteVisitsToday: v.filter(x=>isToday(x.date)).length,
    bookingsThisMonth: bookingsThisMonth.length,
    salesValueThisMonth, expectedCommission, commissionReceived,
    activeRealtors: r.filter(x=>x.status==='Active').length,
    topRealtor: topRealtor ? realtorById(topRealtor) : null,
    topRealtorVal: topVal
  };
}

function submitProject(e, existingId){
  e.preventDefault();
  const f = new FormData(e.target);
  const amenities = f.getAll('amenities');
  const data = {
    name:f.get('name'), developer:f.get('developer'), type:f.get('type'), status:f.get('status'),
    location:f.get('location'), locality:f.get('locality'), district:f.get('district'), state:f.get('state'),
    mapsUrl:f.get('mapsUrl'), website:f.get('website'), dspaceUrl:f.get('dspaceUrl'),
    rera:f.get('rera'), reraStatus:f.get('reraStatus'),
    launchDate:f.get('launchDate'), expectedCompletion:f.get('expectedCompletion'), possessionDate:f.get('possessionDate'),
    unitTypes:f.get('unitTypes'), priceRange:f.get('priceRange'), pricePerSqft:f.get('pricePerSqft')||null,
    amenities, notes:f.get('notes')
  };
  if(existingId){
    Object.assign(projectById(existingId), data);
    toast('Project updated');
  } else {
    const id = uid('DSP', DB.counters.project);
    DB.projects.push({id, ...data, assignedRealtors:[]});
    toast('Project created');
  }
  save(); closeModal(); render();
  return false;
}

function deleteProject(id){
  if(!confirm('Delete this project and all its units? This cannot be undone.')) return;
  DB.projects = DB.projects.filter(p=>p.id!==id);
  DB.units = DB.units.filter(u=>u.projectId!==id);
  save(); render(); toast('Project deleted');
}

/* ---------------------------- COMMISSIONS ---------------------------------- */
function renderCommissions(){
  const totalExpected = DB.bookings.reduce((s,x)=>s+Number(x.commissionAmount||0),0);
  const totalReceived = DB.bookings.filter(x=>x.commissionStatus==='Received').reduce((s,x)=>s+Number(x.commissionAmount||0),0);
  const totalPending = totalExpected - totalReceived;

  const byRealtor = DB.realtors.map(r=>{
    const bs = DB.bookings.filter(b=>b.realtorId===r.id);
    const expected = bs.reduce((s,x)=>s+Number(x.commissionAmount||0),0);
    const received = bs.filter(x=>x.commissionStatus==='Received').reduce((s,x)=>s+Number(x.commissionAmount||0),0);
    return {r, count:bs.length, expected, received, pending: expected-received};
  }).filter(x=>x.count>0).sort((a,b)=>b.expected-a.expected);

  return `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:22px;">
      ${kpi('Expected Commission', formatCr(totalExpected), 'across all bookings', 'gold')}
      ${kpi('Commission Received', formatCr(totalReceived), 'settled to date', 'green')}
      ${kpi('Commission Pending', formatCr(totalPending), 'awaiting settlement', 'amber')}
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><h2>By Realtor</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Realtor</th><th>Agency</th><th>Bookings</th><th>Expected</th><th>Received</th><th>Pending</th></tr></thead>
        <tbody>
        ${byRealtor.map(x=>`<tr>
          <td class="cell-strong">${esc(x.r.name)}</td><td>${esc(x.r.agency)}</td><td>${x.count}</td>
          <td>${formatCr(x.expected)}</td><td style="color:var(--green); font-weight:700;">${formatCr(x.received)}</td>
          <td style="color:var(--amber); font-weight:700;">${formatCr(x.pending)}</td>
        </tr>`).join('') || `<tr><td colspan="6">${emptyRow()}</td></tr>`}
        </tbody>
      </table></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>All Booking Commissions</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Booking</th><th>Realtor</th><th>Sale Value</th><th>Rate</th><th>Commission</th><th>Status</th><th>Booking Date</th></tr></thead>
        <tbody>
        ${DB.bookings.map(b=>`<tr>
          <td class="cell-strong">${b.id}</td>
          <td>${esc(realtorById(b.realtorId)?.name || '—')}</td>
          <td>${formatCr(b.saleValue)}</td><td>${b.commissionRate}%</td>
          <td class="cell-strong">${formatCr(b.commissionAmount)}</td>
          <td>${stBadge(b.commissionStatus)}</td><td class="cell-muted">${formatDate(b.bookingDate)}</td>
        </tr>`).join('') || `<tr><td colspan="7">${emptyRow()}</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
}

/* ---------------------------- init ---------------------------------- */
load();
render();
</script>
</body>
</html>
